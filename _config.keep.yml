version: 4.2.5

base_info:
  primary_color: "#24c6dc"
  title: Reln 的小窝
  author: Reln Ding
  # 注意：不要放在 /images/avatar.svg、/images/logo.svg —— Keep 主题自带同名文件会在构建时覆盖
  avatar: /images/site/avatar.svg
  logo: /images/site/logo.svg
  favicon: /favicon.svg

# 页面顶部菜单
menu:
  home: / || fas fa-home
  archives: /archives || fas fa-archive
  tags: /tags || fas fa-tags
  categories: /categories || fas fa-th
  about: /about || fas fa-user

# A. 首屏 Hero
first_screen:
  enable: true
  background_img: /images/hero-bg.svg
  background_img_dark: /images/hero-bg-dark.svg
  description: 记录技术与思考的点滴

# E. 社交链接
social_contact:
  enable: true
  links:
    github: https://github.com/lcha-reln

# F. 滚动进度条
scroll:
  progress_bar: true
  percent: false
  hide_header: true

# B. 本地搜索
local_search:
  enable: true
  preload: false

# C. 代码块样式升级（v4.x 字段格式）
code_block:
  tools:
    enable: true
    style: mac
  highlight_theme: obsidian

# 首页（post_datetime 取值: created=发布时间 / updated=更新时间）
home:
  category: true
  tag: true
  post_datetime: created
  post_datetime_format: YYYY-MM-DD

# D. 文章阅读体验
post:
  author_badge:
    enable: false
  word_count:
    wordcount: true
    min2read: true
  copyright_info: false

# 文章目录（Keep 4.x 中 toc 是顶层配置，不能嵌在 post 下）
toc:
  enable: true
  number: false
  expand_all: false
  init_open: true
  layout: right

# 图片懒加载
lazyload:
  enable: true

# G. RSS（依赖 hexo-generator-feed 插件）
rss:
  enable: true

# M. PJAX 无刷新跳转
pjax:
  enable: true

# 页脚
footer:
  since: 2026

# 评论（关闭）
comment:
  enable: false

# 注入自定义 CSS
inject:
  enable: true
  css:
    - /css/custom.css
