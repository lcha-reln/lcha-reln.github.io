version: 4.2.5

base_info:
  primary_color: "#24c6dc"
  title: Reln 的小窝
  author: Reln Ding
  avatar: /images/avatar.svg
  logo: /images/logo.svg
  favicon: /favicon.ico

# 页面顶部菜单
menu:
  home: / || fas fa-home
  archives: /archives || fas fa-archive
  tags: /tags || fas fa-tags
  categories: /categories || fas fa-th
  about: /about || fas fa-user

# A. 首屏 Hero
first_screen:
  enable: true
  background_img: /images/hero-bg.svg
  background_img_dark: /images/hero-bg-dark.svg
  description: 记录技术与思考的点滴

# E. 社交链接（email 不带 mailto: 前缀，模板会自动补全）
social_contact:
  enable: true
  links:
    github: https://github.com/lcha-reln
    email: reln@example.com

# F. 滚动进度条
scroll:
  progress_bar: true
  percent: false
  hide_header: true

# B. 本地搜索
local_search:
  enable: true
  preload: false

# C. 代码块样式升级（v4.x 字段格式）
code_block:
  tools:
    enable: true
    style: mac
  highlight_theme: obsidian

# 首页
home:
  category: true
  tag: true
  post_datetime: updated
  post_datetime_format: YYYY-MM-DD

# D. 文章阅读体验
post:
  author_badge:
    enable: false
  word_count:
    wordcount: true
    min2read: true
  toc:
    enable: true
    number: false
    expand_all: false
    init_open: true
    layout: right
  copyright_info: false

# G. RSS（依赖 hexo-generator-feed 插件）
rss:
  enable: true

# M. PJAX 无刷新跳转
pjax:
  enable: true

# 页脚
footer:
  since: 2026

# 评论（关闭）
comment:
  enable: false

# 注入自定义 CSS
inject:
  enable: true
  css:
    - /css/custom.css
