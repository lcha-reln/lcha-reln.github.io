<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#24c6dc;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#24c6dc;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#24c6dc;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1440" height="560" fill="url(#grad)"/>
  <!-- grid lines -->
  <g stroke="#24c6dc" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="70" x2="1440" y2="70"/>
    <line x1="0" y1="140" x2="1440" y2="140"/>
    <line x1="0" y1="210" x2="1440" y2="210"/>
    <line x1="0" y1="280" x2="1440" y2="280"/>
    <line x1="0" y1="350" x2="1440" y2="350"/>
    <line x1="0" y1="420" x2="1440" y2="420"/>
    <line x1="0" y1="490" x2="1440" y2="490"/>
    <line x1="160" y1="0" x2="160" y2="560"/>
    <line x1="320" y1="0" x2="320" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="640" y1="0" x2="640" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
    <line x1="960" y1="0" x2="960" y2="560"/>
    <line x1="1120" y1="0" x2="1120" y2="560"/>
    <line x1="1280" y1="0" x2="1280" y2="560"/>
  </g>
  <!-- accent line -->
  <line x1="0" y1="280" x2="1440" y2="280" stroke="url(#line-grad)" stroke-width="1.5"/>
  <!-- dots -->
  <circle cx="160" cy="140" r="2.5" fill="#24c6dc" opacity="0.4"/>
  <circle cx="480" cy="210" r="2" fill="#24c6dc" opacity="0.3"/>
  <circle cx="800" cy="350" r="3" fill="#24c6dc" opacity="0.5"/>
  <circle cx="1120" cy="140" r="2" fill="#24c6dc" opacity="0.35"/>
  <circle cx="640" cy="490" r="2.5" fill="#24c6dc" opacity="0.3"/>
  <circle cx="960" cy="280" r="4" fill="#24c6dc" opacity="0.2"/>
  <circle cx="320" cy="420" r="2" fill="#24c6dc" opacity="0.3"/>
  <circle cx="1280" cy="350" r="2.5" fill="#24c6dc" opacity="0.4"/>
</svg>
